[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ramp-isotopes"
authors = [
    {name = "Nuclear RAMP team", email = "nuclear.ramp.dev@gmail.com"},
]
description = "Package for lightweight representation of nuclear isotopes"
dynamic = ["version"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["nuclear", "isotope"]
dependencies = [
    "bidict",
    "scipy",
    "pandas",
]

[project.optional-dependencies]
test = [
    "hypothesis",
    "more-itertools",
    "parse",
    "pytest",
    "pytest-regressions"
]

[project.urls]
Homepage = "https://github.com/ramp-nuclear/isotopes"
Documentation = "https://ramp-nuclear.github.io/isotopes/"
Repository = "https://github.com/ramp-nuclear/isotopes.git"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
isotopes = ["*.csv"]

[tool.setuptools.packages.find]
include = ['isotopes*']
exclude = ['tests*']

[tool.setuptools_scm]
